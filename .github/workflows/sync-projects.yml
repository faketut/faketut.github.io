name: Sync projects from GitHub

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC nightly
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update projects section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_projects.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes." || (
            git add source/about/index.md
            git commit -m "chore: sync projects from GitHub [skip ci]"
            git push
          )
